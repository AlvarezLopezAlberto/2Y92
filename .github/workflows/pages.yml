name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: M4F3/package-lock.json

      - name: Install dependencies
        working-directory: M4F3
        run: npm ci

      - name: Build M4F3 Pages artifact
        working-directory: M4F3
        env:
          PAGES_BASE_PATH: /2Y92/M4F3
        run: npm run build:pages

      - name: Assemble Pages artifact
        run: |
          mkdir -p pages-artifact/M4F3
          cp index.html script.js styles.css serve.js pages-artifact/
          touch pages-artifact/.nojekyll
          cp -R M4F3/dist/. pages-artifact/M4F3/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
